<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.1</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
          $("#b1").on("click", () => {
            $("#page *").css("background", "");
            $("p").css("background", "yellow");
          });

          $("#b2").on("click", () => {
            $("#page *").css("background", "");
            $("#left").css("background", "yellow");
          });

          $("#b3").on("click", () => {
            $("#page *").css("background", "");
            $("#left p").css("background", "yellow");
          });

          $("#b4").on("click", () => {
            $("#page *").css("background", "");
            $(".special").css("background", "yellow");
          });

          $("#b5").on("click", () => {
            $("#page *").css("background", "");
            $("p.special").css("background", "yellow");
          });

          $("#b6").on("click", () => {
            $("#page *").css("background", "");
            $("div#right p.special").css("background", "yellow");
          });

          $("#b7").on("click", () => {
            $("#page *").css("background", "");
            $("#page p").css("background", "yellow");
          });

          $("#b8").on("click", () => {
            $("#page *").css("background", "");
            $("#page > p").css("background", "yellow");
          });

          $("#reset").on("click", () => {
            $("#page *").css("background", "");
          });

            // TODO: bind a click event to every button (b1 … b8)

            // TODO: highlight the selected elements with css("background-color", "yellow")

            // TODO: #reset removes all backgrounds
        });
    </script>
</head>
<body>
    <h2>Exercise 1.1 – Selectors</h2>
    <div id="buttons">
        <button id="b1">$("p")</button>
        <button id="b2">$("#left")</button>
        <button id="b3">$("#left p")</button>
        <button id="b4">$(".special")</button>
        <button id="b5">$("p.special")</button>
        <button id="b6">$("div#right p.special")</button>
        <button id="b7">$("#page p")</button>
        <button id="b8">$("#page &gt; p")</button>
        <button id="reset">Reset</button>
    </div>

    <div id="page">
        <h1>Welcome</h1>
        <div id="left">
            <p>Paragraph A</p>
            <p class="special">Paragraph B</p>
        </div>
        <div id="right">
            <p class="special">Paragraph C</p>
            <p>Paragraph D</p>
        </div>
        <div class="special">
            <p>Paragraph E</p>
        </div>
    </div>
</body>
</html>
